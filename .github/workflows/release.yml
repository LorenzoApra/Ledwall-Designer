name: Build desktop release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            platform: macos-arm64
            bundle: dmg
            extension: dmg
          - os: macos-14
            target: x86_64-apple-darwin
            platform: macos-x64
            bundle: dmg
            extension: dmg
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            platform: windows-x64
            bundle: nsis
            extension: exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Rust toolchain and target
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add ${{ matrix.target }}
      - name: Verify release metadata
        run: node scripts/check-release.mjs
      - name: Match tag to package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          test "$GITHUB_REF_NAME" = "v$VERSION"
      - name: Test
        run: pnpm test
      - name: Build installer
        run: pnpm tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundle }} -- --locked
      - name: Collect package and checksum
        id: package
        run: node scripts/collect-release.mjs ${{ matrix.target }} ${{ matrix.extension }} ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: ${{ steps.package.outputs.directory }}/
          if-no-files-found: error
          retention-days: 14

  draft:
    name: Prepare draft release (never publish automatically)
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Verify packages and prepare checksum manifest
        working-directory: release-assets
        shell: bash
        run: |
          test "$(find . -maxdepth 1 -name '*.dmg' | wc -l)" -eq 2
          test "$(find . -maxdepth 1 -name '*.exe' | wc -l)" -eq 1
          cat macos-arm64.sha256 macos-x64.sha256 windows-x64.sha256 > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
          rm macos-arm64.sha256 macos-x64.sha256 windows-x64.sha256
      - name: Create or update a draft
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --json isDraft > release-state.json 2>/dev/null; then
            node -e "if (!require('./release-state.json').isDraft) throw new Error('Refusing to change a published release')"
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft \
              --title "Ledwall Designer V1.0" --notes-file docs/release/v1.0.0.md
          fi
          gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
