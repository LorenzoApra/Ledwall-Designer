[package]
name = "ledwall-designer"
version = "0.1.13"
description = "Progettazione tecnica di ledwall NovaStar"
authors = ["ATS"]
edition = "2021"

[lib]
name = "ledwall_designer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
